[package]
name = "factorio_optimizer"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust port of factorio_optimizer_v2 (Kotlin), module for module"
# A second binary makes a bare `cargo run` ambiguous; the command line stays the default one.
default-run = "factorio_optimizer"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
microlp = "0.6"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny-skia = "0.12"
# The window (docs/GUI_PLAN.md). Optional so `cargo test`, the command line and the parity tests never build it.
eframe = { version = "0.37", optional = true, default-features = false, features = ["glow", "default_fonts", "wayland", "x11"] }
# Decoding the game's own icon PNGs for the preview (level B of the plan); no other image format is needed.
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }

[features]
gui = ["dep:eframe", "dep:image"]

[[bin]]
name = "gui"
path = "src/bin/gui.rs"
required-features = ["gui"]

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# The routing goldens run millions of A* expansions; optimise them, keeping overflow checks and debug assertions.
[profile.test]
opt-level = 2
