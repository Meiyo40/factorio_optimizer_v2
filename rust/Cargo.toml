[package]
name = "factorio_optimizer"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust port of factorio_optimizer_v2 (Kotlin), module for module"

[dependencies]
anyhow = "1"
base64 = "0.22"
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
microlp = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# The routing goldens run millions of A* expansions; optimise them, keeping overflow checks and debug assertions.
[profile.test]
opt-level = 2
