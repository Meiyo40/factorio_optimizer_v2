[package]
name = "factorio_optimizer"
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"
description = "Rust port of factorio_optimizer_v2 (Kotlin), module for module"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
flate2 = "1"
indexmap = { version = "2", features = ["serde"] }
microlp = "0.6"
noto-sans-mono-bitmap = { version = "0.3", default-features = false, features = ["regular", "bold", "size_16", "size_20", "size_24", "size_32", "unicode-basic-latin"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tiny-skia = "0.12"

[profile.release]
codegen-units = 1
lto = "fat"
panic = "abort"

# The routing goldens run millions of A* expansions; optimise them, keeping overflow checks and debug assertions.
[profile.test]
opt-level = 2
